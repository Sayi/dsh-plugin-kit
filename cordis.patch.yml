# Bundle patch for dsh-file-session.
#
# 1. The plugin itself: the target map, the write guard and the prompt section.
# 2. The `create-file` Agent Preset. A preset's `plugins` IS the Agent's whole
#    composition (the shipped `standard` preset lists all 21 rows explicitly), so
#    the curated list below is deliberately a copy of `standard` minus the rows
#    that have nothing to do with editing one document:
#      - delegation      → a subagent's writes carry the child session id, so the
#                          guard cannot attribute them to this Session
#      - planning, schedule, goal → nothing a single-file editor needs
#    `tool-bash`/`tool-pwsh` STAY: a .docx is a ZIP package, so the Office pipeline
#    has to execute python-docx and LibreOffice. That keeps one hole open — a shell
#    redirect is not a tool call the guard can see — so the prompt rules forbid it
#    and the README states it plainly.
#    Revisit this list after a Harness upgrade: it is a copy, not an inheritance.
- insert:
    - id: dsh-file-session
      name: dsh-file-session
    - id: preset-file-session
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: file-session
        name: 文件会话
        description: 一次只服务一个文件：绑定后写入被限制在该文件上，且不可切换。
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是一个「文件会话」模式的协作者，运行在 {{model}} 模型上。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
